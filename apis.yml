name: Jobandtalent
description: 'Jobandtalent is an AI-powered workforce marketplace that connects companies
  with reliable staff for temporary and permanent roles across logistics, warehousing,
  manufacturing, retail, and hospitality. Its platform combines a worker-facing mobile
  app for finding shifts and jobs with an employer-facing business platform for recruitment,
  shift planning, attendance management, and performance coaching. Founded in Spain and
  backed by Atomico, Jobandtalent operates across Europe, the US, and Latin America.
  This API Evangelist profile tracks the company''s public developer, security, and
  compliance surface; the company publishes no public developer API at this time.'
